# ==============================================================================
# Docker Compose for Local Development / Testing
# Builds images directly from local source code
# Usage: docker compose up --build
# ==============================================================================

version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: devops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: devops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devops_network

  # 2. Express Backend API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: devops_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: devops_db
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devops_network

  # 3. React Frontend Service (Served via Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: devops_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - devops_network

# Named volume for persistent database storage
volumes:
  pgdata:

# Isolated bridge network for internal container communication
networks:
  devops_network:
    driver: bridge
