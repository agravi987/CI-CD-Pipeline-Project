name: CD Pipeline (Continuous Deployment)

# Trigger this workflow on push to main or via manual trigger
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # =============================================================
  # Job 1: Build Docker Images & Push to Docker Hub
  # =============================================================
  build-and-push:
    name: 🐳 Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and Push Backend Image
      - name: 🚀 Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/devops-server:latest
            ${{ secrets.DOCKER_USERNAME }}/devops-server:${{ github.sha }}

      # Build and Push Frontend Image
      - name: 🚀 Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/devops-client:latest
            ${{ secrets.DOCKER_USERNAME }}/devops-client:${{ github.sha }}

  # =============================================================
  # Job 2: Deploy to AWS EC2 Instance via SSH
  # =============================================================
  deploy:
    name: ☁️ Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [build-and-push]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # Copy production docker-compose and db init files to EC2
      - name: 📁 Copy Compose and Database files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,db/init.sql"
          target: "~/devops-app"

      # Execute deployment commands on EC2 via SSH
      - name: 🚀 Pull Images & Restart Containers on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "==========================================="
            echo "🚀 Starting Automated Deployment on EC2"
            echo "==========================================="
            cd ~/devops-app

            # Export variables for docker-compose.prod.yml
            export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
            export IMAGE_TAG="latest"

            echo "📦 Pulling latest Docker images..."
            docker pull ${DOCKER_USERNAME}/devops-server:latest
            docker pull ${DOCKER_USERNAME}/devops-client:latest

            echo "🔄 Launching application containers..."
            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            docker compose -f docker-compose.prod.yml up -d

            echo "🧹 Cleaning up dangling/old images..."
            docker image prune -f

            echo "✅ Deployment succeeded!"

  # =============================================================
  # Job 3: Automated Post-Deployment Health Check
  # =============================================================
  health-check:
    name: 🩺 Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: [deploy]

    steps:
      - name: ⏳ Wait for containers and database to boot (20s)
        run: sleep 20

      - name: 🔍 Query Health Check Endpoint
        run: |
          echo "Pinging http://${{ secrets.EC2_HOST }}/api/health ..."
          RESPONSE=$(curl --silent --fail --max-time 10 http://${{ secrets.EC2_HOST }}/api/health || echo "FAILED")
          echo "Response received: $RESPONSE"

          if [[ "$RESPONSE" == *"UP"* ]]; then
            echo "🎉 SUCCESS: API and Database are healthy and live on EC2!"
          else
            echo "❌ ERROR: Health check failed! Please check container logs on EC2."
            exit 1
          fi
