name: CI Pipeline (Continuous Integration)

# Runs on every push or pull request to main or develop
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Test Backend API
  # -------------------------------------------------------------
  backend-test:
    name: 🧪 Test Backend API
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Backend Dependencies
        working-directory: ./server
        run: npm install

      - name: 🧪 Run Automated Tests (Jest & Supertest)
        working-directory: ./server
        run: npm test

  # -------------------------------------------------------------
  # Job 2: Test Frontend React
  # -------------------------------------------------------------
  frontend-test:
    name: 🧪 Test Frontend React
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Frontend Dependencies
        working-directory: ./client
        run: npm install

      - name: 🧪 Run Frontend Tests (Vitest)
        working-directory: ./client
        run: npm test

  # -------------------------------------------------------------
  # Job 3: Security & Vulnerability Scanning (Aqua Security Trivy)
  # -------------------------------------------------------------
  security-scan:
    name: 🛡️ Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: 📥 Checkout repository code
        uses: actions/checkout@v4

      - name: 🐳 Build Backend Docker image locally
        run: docker build -t test-backend:local ./server

      - name: 🔍 Scan Backend image with Trivy (CVE Scanner)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'test-backend:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: 🐳 Build Frontend Docker image locally
        run: docker build -t test-frontend:local ./client

      - name: 🔍 Scan Frontend image with Trivy (CVE Scanner)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'test-frontend:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
